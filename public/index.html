<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Flight - DB Demo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .row { margin-bottom: 1rem; }
    input, button { padding: .6rem; font-size: 1rem; }
    input { width: 100%; box-sizing: border-box; }
    button { cursor: pointer; margin-right: .5rem; }
    pre { background: #f5f5f5; padding: 1rem; border-radius: 8px; overflow: auto; border: 1px solid transparent; }
    pre.success { border-color: #2e7d32; background: #f1faf2; }
    pre.error { border-color: #c62828; background: #fff4f4; color: #8b1c1c; }
  </style>
</head>
<body>
  <h1>Database API Demo</h1>

  <div class="row">
    <button id="initBtn">Init database/tabel</button>
    <button id="readBtn">Lees records</button>
  </div>

  <div class="row">
    <label for="columnName">Kolomnaam</label>
    <input id="columnName" name="columnName" type="text" placeholder="bijv. naam" />
  </div>

  <div class="row">
    <label for="value">String waarde</label>
    <input id="value" name="value" type="text" placeholder="bijv. Jan" />
  </div>

  <div class="row">
    <button id="saveBtn">Opslaan via API</button>
  </div>

  <h2>Output</h2>
  <pre id="output">Nog geen data...</pre>

  <script>
    const output = document.getElementById("output");
    const columnNamePattern = /^[A-Za-z_][A-Za-z0-9_]*$/;

    function formatData(data) {
      if (typeof data === "string") {
        return data;
      }
      if (data === undefined) {
        return "";
      }
      try {
        return JSON.stringify(data, null, 2);
      } catch {
        return String(data);
      }
    }

    function setOutputState(type, title, details) {
      output.classList.remove("success", "error");
      if (type === "success" || type === "error") {
        output.classList.add(type);
      }
      const detailText = details === undefined ? "" : `\n${formatData(details)}`;
      output.textContent = `${title}${detailText}`;
    }

    function extractErrorMessage(payload, fallbackText) {
      if (payload && typeof payload === "object") {
        if (typeof payload.error === "string" && payload.error.trim()) return payload.error;
        if (typeof payload.message === "string" && payload.message.trim()) return payload.message;
      }
      if (typeof payload === "string" && payload.trim()) return payload;
      if (fallbackText && fallbackText.trim()) return fallbackText;
      return "Onbekende fout.";
    }

    async function callApi(url, method = "GET", body) {
      let res;
      try {
        const hasBody = body !== undefined;
        res = await fetch(url, {
          method,
          headers: hasBody ? { "Content-Type": "application/json" } : undefined,
          body: hasBody ? JSON.stringify(body) : undefined
        });
      } catch (err) {
        return {
          ok: false,
          status: 0,
          error: `Netwerkfout: ${err?.message || "Kan server niet bereiken."}`
        };
      }

      let rawText = "";
      try {
        rawText = await res.text();
      } catch {
        rawText = "";
      }

      let data = {};
      if (rawText) {
        try {
          data = JSON.parse(rawText);
        } catch {
          data = rawText;
        }
      }

      if (!res.ok) {
        const message = extractErrorMessage(data, rawText || res.statusText);
        return {
          ok: false,
          status: res.status,
          error: `HTTP ${res.status}: ${message}`,
          details: typeof data === "string" ? { response: data } : data
        };
      }

      return {
        ok: true,
        status: res.status,
        data
      };
    }

    document.getElementById("initBtn").addEventListener("click", async () => {
      const result = await callApi("/api/init", "POST");
      if (!result.ok) {
        setOutputState("error", "Initialiseren mislukt.", {
          fout: result.error,
          details: result.details || null
        });
        return;
      }
      setOutputState("success", "Database/tabel geïnitialiseerd.", result.data);
    });

    document.getElementById("saveBtn").addEventListener("click", async () => {
      const columnName = document.getElementById("columnName").value.trim();
      const value = document.getElementById("value").value;

      if (!columnName) {
        setOutputState("error", "Opslaan geblokkeerd.", "Kolomnaam is verplicht.");
        return;
      }
      if (!columnNamePattern.test(columnName)) {
        setOutputState(
          "error",
          "Opslaan geblokkeerd.",
          "Ongeldige kolomnaam. Gebruik alleen letters/cijfers/underscore en begin niet met een cijfer."
        );
        return;
      }

      const result = await callApi("/api/record", "POST", { columnName, value });
      if (!result.ok) {
        setOutputState("error", "Opslaan mislukt.", {
          fout: result.error,
          details: result.details || null
        });
        return;
      }
      setOutputState("success", "Record opgeslagen.", result.data);
    });

    document.getElementById("readBtn").addEventListener("click", async () => {
      const result = await callApi("/api/records");
      if (!result.ok) {
        setOutputState("error", "Lezen mislukt.", {
          fout: result.error,
          details: result.details || null
        });
        return;
      }
      setOutputState("success", "Records opgehaald.", result.data);
    });
  </script>
</body>
</html>
